<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FriendGPT</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #fff;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(88, 28, 135, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(37, 99, 235, 0.20),
                    transparent 30%
                ),
                #080808;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 25px;

            background: rgba(10, 10, 10, 0.78);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;

            display: flex;
            align-items: center;
            gap: 9px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #b8b8ff,
                    #ffffff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            font-size: 25px;
            -webkit-text-fill-color: initial;
        }

        /* =========================
           MAIN
        ========================== */

        .container {
            width: min(900px, 92%);
            margin: auto;

            padding-top: 75px;
            padding-bottom: 100px;
        }

        /* =========================
           WELCOME
        ========================== */

        .welcome {
            text-align: center;
            margin-bottom: 45px;

            animation: fadeUp 0.7s ease;
        }

        .welcome h1 {
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 800;

            margin-bottom: 12px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a78bfa,
                    #60a5fa,
                    #ffffff
                );

            background-size: 250% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: gradientMove 5s linear infinite;
        }

        .welcome p {
            color: #a1a1aa;
            font-size: 16px;
        }

        /* =========================
           FRIEND SEARCH CHAT
        ========================== */

        #chat {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: 80%;

            padding: 13px 17px;

            border-radius: 16px;

            line-height: 1.5;
            font-size: 15px;

            animation: messageIn 0.35s ease;
        }

        .user-message {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 8px 25px rgba(37, 99, 235, 0.20);

            border-bottom-right-radius: 5px;
        }

        .bot-message {
            align-self: flex-start;

            color: #d4d4d8;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid rgba(255, 255, 255, 0.07);

            border-bottom-left-radius: 5px;
        }

        /* =========================
           PROFILE
        ========================== */

        .profile {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            padding: 32px 25px;

            margin-top: 5px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            border:
                1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation:
                profileIn
                0.6s
                cubic-bezier(.22, 1, .36, 1);
        }

        .profile img {
            width: 250px;
            height: 250px;

            object-fit: cover;

            border-radius: 24px;

            border:
                2px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(99, 102, 241, 0.10);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .profile img:hover {
            transform: scale(1.035);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.65),
                0 0 45px rgba(99, 102, 241, 0.22);
        }

        .profile-info {
            margin-top: 22px;
            width: 100%;
        }

        .profile-info h2 {
            font-size: clamp(23px, 4vw, 30px);
            line-height: 1.25;

            margin-bottom: 22px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #93c5fd
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =========================
           SOCIAL BUTTONS
        ========================== */

        .social-buttons {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .social-btn {
            position: relative;

            min-width: 155px;

            padding: 13px 20px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            color: #fff;
            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            overflow: hidden;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .social-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    110deg,
                    transparent,
                    rgba(255, 255, 255, 0.30),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }

        .social-btn:hover::before {
            left: 140%;
        }

        .social-btn:hover {
            transform:
                translateY(-5px)
                scale(1.025);

            filter: brightness(1.08);
        }

        .social-btn:active {
            transform: scale(0.95);
        }

        .social-btn i {
            position: relative;
            z-index: 2;

            width: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;

            color: #fff;

            transition:
                transform 0.3s ease,
                filter 0.3s ease;
        }

        .social-btn span {
            position: relative;
            z-index: 2;
        }

        .social-btn:hover i {
            transform:
                scale(1.18)
                rotate(-4deg);

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255, 255, 255, 0.55)
                );
        }

        .facebook {
            background:
                linear-gradient(
                    135deg,
                    #1877f2,
                    #0d5bd7
                );

            box-shadow:
                0 10px 28px
                rgba(24, 119, 242, 0.28);
        }

        .facebook:hover {
            box-shadow:
                0 15px 38px
                rgba(24, 119, 242, 0.48);
        }

        .instagram {
            background:
                linear-gradient(
                    135deg,
                    #833ab4 0%,
                    #e1306c 48%,
                    #f77737 100%
                );

            box-shadow:
                0 10px 28px
                rgba(225, 48, 108, 0.28);
        }

        .instagram:hover {
            box-shadow:
                0 15px 38px
                rgba(225, 48, 108, 0.48);
        }

        /* =========================
           GROUP CHAT
        ========================== */

        .group-chat {
            width: 100%;

            margin-top: 55px;

            border-radius: 25px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025)
                );

            border:
                1px solid rgba(255, 255, 255, 0.09);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.40);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: fadeUp 0.7s ease;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 22px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.07);
        }

        .chat-header h2 {
            font-size: 20px;

            display: flex;
            align-items: center;

            gap: 9px;
        }

        .chat-header h2 i {
            color: #818cf8;
        }

        .chat-header p {
            margin-top: 5px;

            color: #71717a;
            font-size: 13px;
        }

        .chat-status {
            display: flex;
            align-items: center;

            gap: 7px;

            padding: 7px 11px;

            border-radius: 20px;

            color: #a1a1aa;

            background:
                rgba(255, 255, 255, 0.045);

            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.8);

            animation:
                livePulse 1.8s infinite;
        }

        .chat-messages {
            height: 390px;

            overflow-y: auto;

            padding: 20px;

            display: flex;
            flex-direction: column;

            gap: 13px;

            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background:
                rgba(255, 255, 255, 0.12);

            border-radius: 20px;
        }

        .chat-empty {
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            color: #71717a;
        }

        .chat-empty i {
            font-size: 35px;

            margin-bottom: 12px;

            color: #6366f1;
        }

        .chat-empty p {
            color: #a1a1aa;

            font-weight: 600;

            margin-bottom: 5px;
        }

        .chat-empty span {
            font-size: 13px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;

            align-items: flex-start;

            max-width: 82%;

            animation:
                messageIn
                0.25s ease;
        }

        .chat-username {
            margin-left: 7px;
            margin-bottom: 4px;

            font-size: 12px;
            font-weight: 700;

            color: #a5b4fc;
        }

        .chat-bubble {
            padding: 10px 14px;

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.055);

            border:
                1px solid rgba(255, 255, 255, 0.065);

            color: #e4e4e7;

            font-size: 14px;

            line-height: 1.45;

            word-break: break-word;
        }

        .chat-time {
            margin-left: 7px;
            margin-top: 4px;

            color: #52525b;

            font-size: 10px;
        }

        .chat-input-area {
            padding: 15px;

            border-top:
                1px solid rgba(255, 255, 255, 0.07);

            background:
                rgba(0, 0, 0, 0.13);
        }

        #chatName,
        #chatMessage {
            border: none;
            outline: none;

            color: #fff;

            background:
                rgba(255, 255, 255, 0.055);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #chatName {
            width: 100%;

            padding: 11px 13px;

            border-radius: 12px;

            margin-bottom: 9px;

            font-size: 13px;
        }

        .message-input-row {
            display: flex;
            gap: 9px;
        }

        #chatMessage {
            flex: 1;

            min-width: 0;

            padding: 12px 14px;

            border-radius: 13px;

            font-size: 14px;
        }

        #chatName:focus,
        #chatMessage:focus {
            border-color:
                rgba(129, 140, 248, 0.45);

            box-shadow:
                0 0 18px
                rgba(99, 102, 241, 0.08);
        }

        #chatName::placeholder,
        #chatMessage::placeholder {
            color: #71717a;
        }

        #chatSend {
            width: 46px;
            min-width: 46px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #2563eb
                );

            box-shadow:
                0 7px 20px
                rgba(37, 99, 235, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #chatSend:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(37, 99, 235, 0.42);
        }

        #chatSend:active {
            transform: scale(0.93);
        }

        #chatSend:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform:
                    translateY(10px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes profileIn {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes gradientMove {

            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

            100% {
                background-position: 0% center;
            }

        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }

        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            header {
                height: 62px;
                padding: 0 17px;
            }

            .logo {
                font-size: 20px;
            }

            .container {
                width: 94%;

                padding-top: 55px;
                padding-bottom: 70px;
            }

            .welcome {
                margin-bottom: 35px;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .welcome p {
                font-size: 14px;
            }

            .profile {
                padding: 25px 17px;
                border-radius: 23px;
            }

            .profile img {
                width: 200px;
                height: 200px;

                border-radius: 20px;
            }

            .profile-info h2 {
                font-size: 23px;
                margin-bottom: 20px;
            }

            .social-buttons {
                flex-direction: column;
                width: 100%;
            }

            .social-btn {
                width: 100%;
                min-width: 0;
            }

            .message {
                max-width: 90%;
                font-size: 14px;
            }

            .group-chat {
                margin-top: 40px;
                border-radius: 20px;
            }

            .chat-header {
                padding: 17px;
            }

            .chat-header h2 {
                font-size: 18px;
            }

            .chat-messages {
                height: 350px;
                padding: 15px;
            }

            .chat-message {
                max-width: 90%;
            }

            .chat-input-area {
                padding: 12px;
            }
        }

        @media (max-width: 380px) {

            .profile img {
                width: 180px;
                height: 180px;
            }

            .welcome h1 {
                font-size: 28px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">

            <span class="logo-icon">🤖</span>

            <span>FriendGPT</span>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">

        <div class="welcome" id="welcome">

            <h1>
                Who do you want to know? 👀
            </h1>

            <p>
                Ask me about someone from your friend group.
            </p>

        </div>


        <!-- Friend Search Chat -->

        <div id="chat"></div>


        <!-- =========================
             GROUP CHAT
        ========================== -->

        <section class="group-chat">

            <div class="chat-header">

                <div>

                    <h2>
                        <i class="fa-solid fa-comments"></i>
                        Group Chat
                    </h2>

                    <p>
                        Talk with everyone 👀
                    </p>

                </div>

                <div class="chat-status">

                    <span class="status-dot"></span>

                    Live

                </div>

            </div>


            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-empty">

                    <i
                        class="fa-regular fa-comment-dots"
                    ></i>

                    <p>
                        No messages yet.
                    </p>

                    <span>
                        Be the first one to say something 👋
                    </span>

                </div>

            </div>


            <div class="chat-input-area">

                <input
                    type="text"
                    id="chatName"
                    placeholder="Your name"
                    maxlength="30"
                    autocomplete="off"
                >


                <div class="message-input-row">

                    <input
                        type="text"
                        id="chatMessage"
                        placeholder="Type a message..."
                        maxlength="500"
                        autocomplete="off"
                    >


                    <button
                        id="chatSend"
                        type="button"
                        aria-label="Send message"
                    >

                        <i
                            class="fa-solid fa-paper-plane"
                        ></i>

                    </button>

                </div>

            </div>

        </section>

    </main>


    <script>

        /* =========================================
           FRIEND DATA
        ========================================== */

        const friends = {

            "M.A. Ahsan Habib Abir": {

            },

            },

            "Abdullah Al Rafid": {

            },

            },

            "Adriana Nuha": {

                facebook:
                    "https://www.facebook.com/adriana.nuha.2024",

            },

            "Fariha Mahbub Labiba": {

                instagram:
                    "https://www.instagram.com/labiibbaa/"
            },

            "Dipi Sharleen": {

        };


        /* =========================================
           HTML ESCAPE
        ========================================== */

        function escapeHTML(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           FIND FRIEND
        ========================================== */

        function findFriend(query) {

            const cleanQuery =
                query
                    .toLowerCase()
                    .trim()
                    .replace(/[.,!?]/g, "");


            for (const name in friends) {

                const cleanName =
                    name
                        .toLowerCase()
                        .replace(/[.,!?]/g, "");


                if (
                    cleanQuery.includes(cleanName) ||
                    cleanName.includes(cleanQuery)
                ) {

                    return name;

                }

            }


            for (const name in friends) {

                const parts =
                    name
                        .toLowerCase()
                        .replace(/[.,!?]/g, "")
                        .split(/\s+/);


                for (const part of parts) {

                    if (
                        part.length > 2 &&
                        cleanQuery.includes(part)
                    ) {

                        return name;

                    }

                }

            }


            return null;

        }


        /* =========================================
           ADD SEARCH MESSAGE
        ========================================== */

        function addMessage(text, type) {

            const chat =
                document.getElementById("chat");


            const message =
                document.createElement("div");


            message.className =
                "message " +
                (
                    type === "user"
                        ? "user-message"
                        : "bot-message"
                );


            message.innerHTML = text;


            chat.appendChild(message);


            window.scrollTo({

                top:
                    document.body.scrollHeight,

                behavior: "smooth"

            });


            return message;

        }


        /* =========================================
           SHOW PROFILE
        ========================================== */

        function showProfile(name) {

            const friend = friends[name];

            const safeName =
                escapeHTML(name);


            const profileHTML = `

                <div class="profile">

                    <img
                        src="${friend.photo}"
                        alt="${safeName}"
                        onerror="this.src='https://placehold.co/500x500/202020/ffffff?text=${encodeURIComponent(name)}'"
                    >

                    <div class="profile-info">

                        <h2>
                            ${safeName}
                        </h2>

                        <div class="social-buttons">

                            <a
                                class="social-btn facebook"
                                href="${friend.facebook}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <i
                                    class="fa-brands fa-facebook-f"
                                ></i>

                                <span>
                                    Facebook
                                </span>

                            </a>


                            <a
                                class="social-btn instagram"
                                href="${friend.instagram}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <i
                                    class="fa-brands fa-instagram"
                                ></i>

                                <span>
                                    Instagram
                                </span>

                            </a>

                        </div>

                    </div>

                </div>

            `;


            addMessage(
                profileHTML,
                "bot"
            );

        }


        /* =========================================
           SEND FRIEND SEARCH
        ========================================== */

        function sendMessage() {

            const input =
                document.getElementById("userInput");


            const query =
                input.value.trim();


            if (!query) {
                return;
            }


            document
                .getElementById("welcome")
                .style.display = "none";


            addMessage(
                escapeHTML(query),
                "user"
            );


            input.value = "";


            const thinking =
                addMessage(
                    "FriendGPT is thinking... 🤔",
                    "bot"
                );


            setTimeout(() => {

                thinking.remove();


                const friendName =
                    findFriend(query);


                if (friendName) {

                    addMessage(
                        `Here's what I found about <strong>${escapeHTML(friendName)}</strong> 👀`,
                        "bot"
                    );


                    showProfile(friendName);

                } else {

                    addMessage(
                        "Hmm... I couldn't find that person in the friend group. 😅<br><br>Try using their first name or full name.",
                        "bot"
                    );

                }

            }, 800);

        }


        /* =========================================
           SEARCH SEND BUTTON
        ========================================== */

        /*
           This keeps the original search input
           working if it exists.
        */

        const userInput =
            document.getElementById("userInput");

        const sendBtn =
            document.getElementById("sendBtn");


        if (sendBtn) {

            sendBtn.addEventListener(
                "click",
                sendMessage
            );

        }


        if (userInput) {

            userInput.addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );

        }


        /* =========================================
           SUPABASE CONFIG
        ========================================== */

        /*
           IMPORTANT:

           Replace these TWO values with your
           Supabase Project URL and Publishable Key.

           DO NOT put a Supabase SECRET key here.
        */

        const SUPABASE_URL =
            "https://geoixaectlaueevbnvxo.supabase.co/rest/v1/";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_JzLLw1WlQzaEo-qoVbLLLQ_xJ6iRfrM";


        /* =========================================
           START SUPABASE CHAT
        ========================================== */

        let supabaseClient = null;


        if (
            SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
            SUPABASE_PUBLISHABLE_KEY !==
                "YOUR_SUPABASE_PUBLISHABLE_KEY"
        ) {

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_PUBLISHABLE_KEY
                );

        }


        /* =========================================
           CHAT ELEMENTS
        ========================================== */

        const chatMessages =
            document.getElementById(
                "chatMessages"
            );


        const chatName =
            document.getElementById(
                "chatName"
            );


        const chatMessage =
            document.getElementById(
                "chatMessage"
            );


        const chatSend =
            document.getElementById(
                "chatSend"
            );


        /* =========================================
           ESCAPE CHAT TEXT
        ========================================== */

        function escapeChatText(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           TIME
        ========================================== */

        function formatChatTime(date) {

            return new Date(date)
                .toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });

        }


        /* =========================================
           RENDER CHAT MESSAGE
        ========================================== */

        function renderChatMessage(message) {

            const emptyState =
                chatMessages.querySelector(
                    ".chat-empty"
                );


            if (emptyState) {
                emptyState.remove();
            }


            const wrapper =
                document.createElement("div");


            wrapper.className =
                "chat-message";


            wrapper.innerHTML = `

                <div class="chat-username">
                    ${escapeChatText(
                        message.username
                    )}
                </div>

                <div class="chat-bubble">
                    ${escapeChatText(
                        message.message
                    )}
                </div>

                <div class="chat-time">
                    ${formatChatTime(
                        message.created_at
                    )}
                </div>

            `;


            chatMessages.appendChild(
                wrapper
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }


        /* =========================================
           LOAD OLD MESSAGES
        ========================================== */

        async function loadChatMessages() {

            if (!supabaseClient) {

                return;

            }


            const {
                data,
                error
            } = await supabaseClient

                .from("messages")

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )

                .limit(100);


            if (error) {

                console.error(
                    "Could not load messages:",
                    error
                );

                return;

            }


            chatMessages.innerHTML = "";


            if (
                !data ||
                data.length === 0
            ) {

                chatMessages.innerHTML = `

                    <div class="chat-empty">

                        <i
                            class="fa-regular fa-comment-dots"
                        ></i>

                        <p>
                            No messages yet.
                        </p>

                        <span>
                            Be the first one to say something 👋
                        </span>

                    </div>

                `;

                return;

            }


            data.forEach(
                renderChatMessage
            );


            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }


        /* =========================================
           SEND CHAT MESSAGE
        ========================================== */

        async function sendChatMessage() {

            if (!supabaseClient) {

                alert(
                    "Chat is not connected yet. Add your Supabase URL and Publishable Key first."
                );

                return;

            }


            const username =
                chatName.value.trim();


            const message =
                chatMessage.value.trim();


            if (!username) {

                chatName.focus();

                return;

            }


            if (!message) {

                chatMessage.focus();

                return;

            }


            chatSend.disabled = true;


            const {
                error
            } = await supabaseClient

                .from("messages")

                .insert({

                    username:
                        username.slice(
                            0,
                            30
                        ),

                    message:
                        message.slice(
                            0,
                            500
                        )

                });


            chatSend.disabled = false;


            if (error) {

                console.error(
                    "Message sending failed:",
                    error
                );


                alert(
                    "Message send failed. Check your Supabase setup."
                );


                return;

            }


            chatMessage.value = "";

            chatMessage.focus();

        }


        /* =========================================
           CHAT SEND BUTTON
        ========================================== */

        chatSend.addEventListener(
            "click",
            sendChatMessage
        );


        /* =========================================
           ENTER TO SEND CHAT
        ========================================== */

        chatMessage.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendChatMessage();

                }

            }
        );


        /* =========================================
           REAL-TIME CHAT
        ========================================== */

        if (supabaseClient) {

            supabaseClient

                .channel(
                    "friendgpt-chat"
                )

                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages"
                    },

                    function(payload) {

                        renderChatMessage(
                            payload.new
                        );

                    }
                )

                .subscribe();

        }


        /* =========================================
           LOAD CHAT
        ========================================== */

        loadChatMessages();


    </script>

</body>
</html>
